<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Loqii - Dashboard</title>
  <style>
    :root {
      --loqii-ink: #011627;
      --loqii-paper: #F7F3E3;
      --loqii-coral: #C97064;
      --loqii-muted: #606D5D;
      --loqii-green: #3F6C51;
      --bg:        var(--loqii-ink);
      --surface:   var(--loqii-ink);
      --surface2:  rgba(96,109,93,.16);
      --border:    rgba(96,109,93,.34);
      --text:      var(--loqii-paper);
      --muted:     rgba(247,243,227,.68);
      --accent:    var(--loqii-green);
      --accent-glow: rgba(63,108,81,.22);
      --green:     var(--loqii-green);
      --red:       var(--loqii-coral);
      --orange:    var(--loqii-coral);
      --app-bg: var(--bg);
      --surface-elevated: var(--surface2);
      --surface-muted: var(--surface2);
      --text-primary: var(--text);
      --text-secondary: var(--muted);
      --text-muted: var(--muted);
      --text-danger: var(--loqii-coral);
      --text-success: var(--loqii-green);
      --accent-primary: var(--loqii-green);
      --accent-danger: var(--loqii-coral);
      --radius:    8px;
    }
    body[data-theme="light"] {
      --bg: var(--loqii-paper);
      --surface: var(--loqii-paper);
      --surface2: rgba(96,109,93,.09);
      --surface-elevated: var(--surface2);
      --surface-muted: var(--surface2);
      --border: rgba(96,109,93,.32);
      --text: var(--loqii-ink);
      --muted: rgba(1,22,39,.66);
      --accent-glow: rgba(63,108,81,.15);
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100vh;
      background:
        radial-gradient(circle at 18% 0%, rgba(63,108,81,.18), transparent 34%),
        var(--app-bg);
      color: var(--text-primary);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 13px; overflow: hidden;
      -webkit-app-region: drag;
    }

    .titlebar {
      position: fixed; top: 0; left: 0; right: 0; height: 36px;
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 14px; -webkit-app-region: drag;
      border-bottom: 1px solid var(--border);
      background: var(--surface-elevated);
    }
    .titlebar-label {
      font-size: 0.75rem; font-weight: 700; color: var(--muted);
      text-transform: uppercase; letter-spacing: 0.07em;
    }
    .win-btn {
      -webkit-app-region: no-drag;
      width: 12px; height: 12px; border-radius: 50%;
      border: none; cursor: pointer; opacity: .7; transition: opacity .15s;
    }
    .win-btn:hover { opacity: 1; }
    .win-close { background: var(--red); }

    .page {
      -webkit-app-region: no-drag;
      margin-top: 36px; height: calc(100vh - 36px);
      overflow-y: auto; padding: 20px 20px 32px;
      display: flex; flex-direction: column; gap: 20px;
    }
    .page::-webkit-scrollbar { width: 4px; }
    .page::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

    /* Profile card */
    .profile-card {
      background: var(--surface-elevated); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 18px 16px;
      display: flex; align-items: center; gap: 14px;
    }
    .avatar {
      width: 52px; height: 52px; border-radius: 50%;
      background: linear-gradient(135deg, var(--accent-primary), var(--loqii-muted));
      display: flex; align-items: center; justify-content: center;
      font-size: 1.3rem; font-weight: 700; color: var(--loqii-paper);
      flex-shrink: 0; overflow: hidden;
    }
    .avatar img { width: 100%; height: 100%; object-fit: cover; }
    .profile-info { flex: 1; min-width: 0; }
    .profile-name {
      font-size: 1rem; font-weight: 700; letter-spacing: -0.01em;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .profile-email {
      font-size: 0.78rem; color: var(--muted); margin-top: 2px;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }

    /* Credits banner */
    .credits-card {
      background: var(--surface-elevated); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 16px;
      display: flex; flex-direction: column; gap: 8px;
    }
    .credits-header {
      display: flex; align-items: baseline; justify-content: space-between;
    }
    .credits-label {
      font-size: 0.62rem; font-weight: 700;
      text-transform: uppercase; letter-spacing: 0.07em; color: var(--muted);
    }
    .credits-value {
      font-size: 2rem; font-weight: 800; letter-spacing: 0; color: var(--green);
    }
    .credits-value.low   { color: var(--orange); }
    .credits-value.empty { color: var(--red); }
    .credits-time  { font-size: 0.78rem; color: var(--muted); }
    .credits-used  { font-size: 0.72rem; color: var(--muted); }
    .btn-add-credits {
      align-self: flex-start;
      padding: 7px 14px;
      font-size: 0.8rem; font-weight: 700; font-family: inherit;
      border: 1px solid var(--accent-primary); border-radius: 6px;
      background: var(--accent-primary);
      color: var(--loqii-paper); cursor: pointer;
      transition: all 0.2s cubic-bezier(0.4,0,0.2,1);
    }
    .btn-add-credits:hover { filter: brightness(1.1); box-shadow: 0 0 12px var(--accent-glow); }

    /* Section */
    .section-title {
      font-size: 0.62rem; font-weight: 700;
      text-transform: uppercase; letter-spacing: 0.07em; color: var(--muted);
      margin-bottom: 6px;
    }

    /* Info card rows */
    .info-card {
      background: var(--surface-elevated); border: 1px solid var(--border);
      border-radius: var(--radius); overflow: hidden;
    }
    .row {
      display: flex; align-items: center; justify-content: space-between;
      padding: 10px 14px; border-bottom: 1px solid var(--border); gap: 12px;
    }
    .row:last-child { border-bottom: none; }
    .row-label { font-size: 0.82rem; font-weight: 500; }
    .row-value {
      font-size: 0.78rem; color: var(--muted);
      text-align: right; max-width: 200px;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .row-value.accent { color: var(--accent); }
    .row-value.green  { color: var(--green); }

    /* Purchase history */
    .purchase-row {
      display: flex; align-items: center; justify-content: space-between;
      padding: 9px 14px; border-bottom: 1px solid var(--border); gap: 10px;
    }
    .purchase-row:last-child { border-bottom: none; }
    .purchase-left { display: flex; flex-direction: column; gap: 2px; }
    .purchase-name { font-size: 0.82rem; font-weight: 600; }
    .purchase-date { font-size: 0.72rem; color: var(--muted); }
    .purchase-right { text-align: right; flex-shrink: 0; }
    .purchase-credits { font-size: 0.82rem; font-weight: 700; color: var(--green); }
    .purchase-price  { font-size: 0.72rem; color: var(--muted); }
    .no-purchases { padding: 16px 14px; color: var(--muted); font-size: 0.8rem; }

    /* Action buttons */
    .btn {
      padding: 7px 14px; font-size: 0.8rem; font-weight: 600; font-family: inherit;
      border-radius: 6px; cursor: pointer; border: none;
      white-space: nowrap; transition: all .15s; flex-shrink: 0;
    }
    .btn-ghost {
      background: var(--surface-muted); color: var(--text-secondary); border: 1px solid var(--border);
    }
    .btn-ghost:hover { color: var(--text-primary); border-color: var(--accent-primary); }
    .btn-danger {
      background: var(--surface-muted); color: var(--accent-danger);
      border: 1px solid var(--accent-danger);
    }
    .btn-danger:hover { border-color: var(--accent-danger); }

    .ver { text-align: center; font-size: 0.68rem; color: var(--muted); }

    .loqii-confirm-overlay {
      position: fixed; inset: 0; z-index: 9999;
      display: flex; align-items: center; justify-content: center;
      padding: 20px; background: rgba(1,22,39,.68); backdrop-filter: blur(8px);
    }
    .loqii-confirm-card {
      width: min(360px, 100%);
      background: var(--surface-elevated);
      color: var(--text-primary);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 18px;
      box-shadow: 0 18px 60px rgba(1,22,39,.35);
    }
    .loqii-confirm-title { font-weight: 850; margin-bottom: 8px; }
    .loqii-confirm-copy {
      font-size: .86rem; color: var(--text-secondary);
      line-height: 1.5; margin-bottom: 16px;
    }
    .loqii-confirm-actions { display: flex; justify-content: flex-end; gap: 8px; }

    .spinner {
      display: inline-block; width: 11px; height: 11px;
      border: 2px solid rgba(63,108,81,.28); border-top-color: var(--accent);
      border-radius: 50%; animation: spin .7s linear infinite; vertical-align: middle;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body data-theme="light">
<script>
  window.tzurah?.getPreference?.("loqii-theme", "light")
    .then((theme) => { document.body.dataset.theme = theme === "light" ? "light" : "dark"; })
    .catch(() => { document.body.dataset.theme = "light"; });
</script>

<div class="titlebar">
  <span class="titlebar-label">My Account</span>
  <button class="win-btn win-close" id="btn-close"></button>
</div>

<div class="page">

  <!-- Profile -->
  <div class="profile-card">
    <div class="avatar" id="avatar">?</div>
    <div class="profile-info">
      <div class="profile-name" id="profile-name">Loading...</div>
      <div class="profile-email" id="profile-email"></div>
    </div>
  </div>

  <!-- Credits -->
  <div class="credits-card">
    <div class="credits-header">
      <span class="credits-label">Credits Remaining</span>
    </div>
    <div class="credits-value" id="credits-val">--</div>
    <div class="credits-time"  id="credits-time"></div>
    <div class="credits-used"  id="credits-used"></div>
    <button class="btn-add-credits" id="btn-add-credits">Add Credits</button>
  </div>

  <!-- App info -->
  <div>
    <div class="section-title">Application</div>
    <div class="info-card">
      <div class="row">
        <span class="row-label">Version</span>
        <span class="row-value" id="val-version">--</span>
      </div>
      <div class="row">
        <span class="row-label">Platform</span>
        <span class="row-value" id="val-platform">--</span>
      </div>
    </div>
  </div>

  <!-- Purchase history -->
  <div>
    <div class="section-title">Purchase History</div>
    <div class="info-card" id="purchases-list">
      <div class="no-purchases">Loading...</div>
    </div>
  </div>

  <!-- Actions -->
  <div>
    <div class="section-title">Account</div>
    <div class="info-card">
      <div class="row">
        <span class="row-label">Sync credits with server</span>
        <button class="btn btn-ghost" id="btn-sync">Sync Now</button>
      </div>
      <div class="row">
        <span class="row-label">Sign out of Loqii</span>
        <button class="btn btn-danger" id="btn-signout">Sign Out</button>
      </div>
    </div>
  </div>

  <div class="ver" id="footer-ver"></div>
</div>

<script>
  const r = window.tzurah;

  document.getElementById("btn-close").addEventListener("click", () => window.close());
  document.getElementById("btn-add-credits").addEventListener("click", () => {
    r.openTopup();
    window.close();
  });

  function creditsToTime(c) {
    const mins = Math.round(c * 10 / 60);
    if (mins >= 60) return `${Math.floor(mins/60)}h ${mins%60}m`;
    return `${mins}m`;
  }

  function fmtDate(ts) {
    if (!ts) return "--";
    return new Date(ts).toLocaleDateString(undefined, { month: "short", day: "numeric", year: "numeric" });
  }

  function updateCreditsUI(credits, totalUsed) {
    const el   = document.getElementById("credits-val");
    const time = document.getElementById("credits-time");
    const used = document.getElementById("credits-used");
    el.textContent   = credits.toLocaleString();
    time.textContent = `${creditsToTime(credits)} of face-swap time`;
    if (typeof totalUsed === "number") {
      used.textContent = `${totalUsed.toLocaleString()} credits used total`;
    }
    el.className = "credits-value" +
      (credits <= 0 ? " empty" : credits < 20 ? " low" : "");
  }

  async function loadData() {
    const [session, info] = await Promise.all([
      r.getSession(),
      r.appInfo(),
    ]);

    if (session) {
      const avatarEl = document.getElementById("avatar");
      if (session.avatar_url) {
        avatarEl.innerHTML = `<img src="${session.avatar_url}" alt="">`;
      } else {
        avatarEl.textContent = (session.display_name || session.email || "--")[0].toUpperCase();
      }
      document.getElementById("profile-name").textContent  = session.display_name || "--";
      document.getElementById("profile-email").textContent = session.email        || "--";

      updateCreditsUI(session.credits_remaining, session.total_credits_used);
    }

    if (info) {
      document.getElementById("val-version").textContent  = info.version  || "--";
      document.getElementById("val-platform").textContent = info.platform || "--";
      document.getElementById("footer-ver").textContent   = `Loqii v${info.version || "--"} - by Tzurah`;
    }

    r.getBalance().then(({ credits }) => {
      if (typeof credits === "number") {
        updateCreditsUI(credits, session?.total_credits_used);
      }
    }).catch(() => {});

    loadPurchases();
  }

  async function loadPurchases() {
    const list = document.getElementById("purchases-list");
    try {
      const result = await r.getPurchases?.();
      const purchases = result?.purchases || [];

      if (purchases.length === 0) {
        list.innerHTML = '<div class="no-purchases">No purchases yet.</div>';
        return;
      }

      list.innerHTML = purchases.slice(0, 10).map((p) => `
        <div class="purchase-row">
          <div class="purchase-left">
            <div class="purchase-name">${p.pack_name || "--"}</div>
            <div class="purchase-date">${fmtDate(p.created_at)}</div>
          </div>
          <div class="purchase-right">
            <div class="purchase-credits">+${p.credits_added} credits</div>
            <div class="purchase-price">${p.price_usd > 0 ? "$" + p.price_usd : "Gift"}</div>
          </div>
        </div>
      `).join("");
    } catch {
      list.innerHTML = '<div class="no-purchases">Could not load purchase history.</div>';
    }
  }

  r.on("credits:updated", (credits) => updateCreditsUI(credits));

  document.getElementById("btn-sync").addEventListener("click", async () => {
    const btn = document.getElementById("btn-sync");
    btn.disabled = true;
    btn.innerHTML = '<span class="spinner"></span>';

    await r.syncUsage().catch(() => {});
    const { credits } = await r.getBalance().catch(() => ({ credits: null }));
    if (typeof credits === "number") updateCreditsUI(credits);

    btn.textContent = "Synced!";
    setTimeout(() => { btn.textContent = "Sync Now"; btn.disabled = false; }, 2000);
  });

  function showConfirm(message) {
    return new Promise((resolve) => {
      const overlay = document.createElement("div");
      overlay.className = "loqii-confirm-overlay";
      overlay.innerHTML = `
        <div class="loqii-confirm-card" role="dialog" aria-modal="true" aria-label="Confirm sign out">
          <div class="loqii-confirm-title">Confirm sign out</div>
          <div class="loqii-confirm-copy">${message}</div>
          <div class="loqii-confirm-actions">
            <button id="confirm-cancel" class="btn btn-ghost" type="button">Cancel</button>
            <button id="confirm-ok" class="btn btn-danger" type="button">Sign out</button>
          </div>
        </div>`;
      document.body.appendChild(overlay);
      const finish = (value) => { overlay.remove(); resolve(value); };
      overlay.querySelector("#confirm-cancel").addEventListener("click", () => finish(false));
      overlay.querySelector("#confirm-ok").addEventListener("click", () => finish(true));
      overlay.addEventListener("click", (event) => { if (event.target === overlay) finish(false); });
    });
  }

  document.getElementById("btn-signout").addEventListener("click", async () => {
    if (!(await showConfirm("Sign out of Loqii?"))) return;
    await r.logout();
    window.close();
  });

  loadData();
</script>
</body>
</html>
